services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qtrain}
      POSTGRES_USER: ${POSTGRES_USER:-qtrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?FLASK_SECRET_KEY is required}
      WEB_CONCURRENCY: 3
      GUNICORN_WORKER_CLASS: gthread
      GUNICORN_THREADS: 2
      GUNICORN_TIMEOUT: 60
      GUNICORN_GRACEFUL_TIMEOUT: 30
      GUNICORN_KEEPALIVE: 5
      GUNICORN_MAX_REQUESTS: 1000
      GUNICORN_MAX_REQUESTS_JITTER: 100
      GUNICORN_PRELOAD_APP: "true"
      GUNICORN_WORKER_TMP_DIR: /dev/shm
      GUNICORN_LOG_LEVEL: info
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/ReactApp/Dockerfile
    environment:
      VITE_AZURE_TENANT_ID: ${VITE_AZURE_TENANT_ID}
      VITE_AZURE_CLIENT_ID: ${VITE_AZURE_CLIENT_ID}
      VITE_AZURE_API_SCOPE: ${VITE_AZURE_API_SCOPE}
      VITE_AZURE_REDIRECT_URI: ${VITE_AZURE_REDIRECT_URI:-}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    volumes:
      - ./frontend/ReactApp:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qtrain}
      POSTGRES_USER: ${POSTGRES_USER:-qtrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qtrain -d qtrain"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  cloudflared:
    image: cloudflare/cloudeflare:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    enviroment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
    networks:
      - default

volumes:
  db_data:
  frontend_node_modules:
