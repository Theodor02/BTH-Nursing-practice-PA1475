# Rate limit zone: keyed by real client IP, 10MB state, 10 req/s steady-state.
# burst=20 nodelay lets a user fire up to 20 requests instantly (e.g. page load),
# then enforces the 10 req/s cap. Excess requests get 429, not queued.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;

    # --- Hard limits --------------------------------------------------------
    # Block bodies larger than 64 KB before they reach gunicorn.
    client_max_body_size 64k;
    # Abort slow-POST / Slowloris attacks: if the client stops sending body
    # data for 10 s, nginx drops the connection.
    client_body_timeout 10s;
    # If gunicorn stops sending response data for 30 s, drop the connection.
    proxy_read_timeout 30s;
    # Shrink idle keep-alive window to limit connection-hold attacks.
    keepalive_timeout 10s;

    # --- Security headers ---------------------------------------------------
    # Prevent the page from being embedded in a frame on another origin.
    add_header X-Frame-Options "DENY" always;
    # Stop browsers from MIME-sniffing a response away from the declared type.
    add_header X-Content-Type-Options "nosniff" always;
    # Limit referrer information sent to third parties.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- API proxy ----------------------------------------------------------
    location ~ ^/(login|logout|cat_request|question_post|grade_question|question_submit|session_request|session_post|ping|api|admin|stats)(/.*)?$ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Strip any attacker-supplied forwarded-for header so the backend
        # always sees the real connection IP if it ever needs it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://backend:5000;
    }

    # --- Frontend proxy -----------------------------------------------------
    location / {
        proxy_set_header Host $host;
        proxy_pass http://frontend:5173;
    }
}
