services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["flask", "--app", "app", "run", "--debug", "--host", "0.0.0.0", "--port", "5000"]
    env_file:
      - .env
    environment:
      POSTGRES_DB: qtrain
      POSTGRES_USER: qtrain
      POSTGRES_PASSWORD: qtrain
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      FLASK_DEBUG: 1
      FLASK_SECRET_KEY: dev-secret-key-change-in-production
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: "http://localhost:5173,http://localhost:8080,http://192.168.109.117:8080"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/ReactApp/Dockerfile
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"]
    environment:
      BACKEND_URL: http://backend:5000
      VITE_AZURE_TENANT_ID: ${VITE_AZURE_TENANT_ID}
      VITE_AZURE_CLIENT_ID: ${VITE_AZURE_CLIENT_ID}
      VITE_AZURE_API_SCOPE: ${VITE_AZURE_API_SCOPE}
      VITE_AZURE_REDIRECT_URI: ${VITE_AZURE_REDIRECT_URI:-}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    volumes:
      - ./frontend/ReactApp:/app
      - frontend_node_modules:/app/node_modules

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: qtrain
      POSTGRES_USER: qtrain
      POSTGRES_PASSWORD: qtrain
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qtrain -d qtrain"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  frontend_node_modules:
