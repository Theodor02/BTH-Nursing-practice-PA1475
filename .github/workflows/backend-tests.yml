name: Backend Unit Tests

on:
  pull_request:
    paths:
      - backend/**
      - .github/workflows/backend-tests.yml
  workflow_dispatch:

jobs:
  backend-pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: qtrain
          POSTGRES_USER: qtrain
          POSTGRES_PASSWORD: qtrain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qtrain -d qtrain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Seed test database
        working-directory: backend
        env:
          ENV: dev
          CONFIRM_DROP_SCHEMA: "true"
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          POSTGRES_USER: qtrain
          POSTGRES_PASSWORD: qtrain
          POSTGRES_DB: qtrain
        run: python logic/database/seeding/seed_defaults.py

      - name: Run backend pytest
        working-directory: backend
        run: pytest
